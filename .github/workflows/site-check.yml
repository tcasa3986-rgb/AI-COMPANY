name: Verificar sitio y flujo editorial
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/build-site.js
      - run: node scripts/check-site.js
      - run: node --test scripts/tests/blog-editorial.test.js
      - run: node scripts/package-site.js
      - run: node scripts/check-site.js
        env:
          SITE_CHECK_ROOT: dist
