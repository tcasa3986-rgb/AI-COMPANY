name: Blog editorial — generar borrador
on:
  workflow_dispatch:
    inputs:
      topic:
        description: 'Proceso concreto que cubrirá la guía'
        required: true
        type: string
      sources:
        description: 'JSON de fuentes oficiales: [{"title":"Fuente","url":"https://..."}]'
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: blog-editorial
  cancel-in-progress: false
jobs:
  draft:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Generar borrador validado
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          BLOG_TOPIC: ${{ inputs.topic }}
          BLOG_SOURCES: ${{ inputs.sources }}
        run: node scripts/generate-blog.js
      - name: Guardar borrador para revisión
        uses: actions/upload-artifact@v4
        with:
          name: blog-draft
          path: _rediseno/blog-drafts/*.json
          if-no-files-found: error
          retention-days: 30
